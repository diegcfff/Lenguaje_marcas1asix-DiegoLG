<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receta de cocina</title>
    <link rel="stylesheet" href="./estilos.css">
</head>
<body>
    <h1>Paella</h1>

    <h2>Ingredientes</h2>
    <ul class="ingredientes">
        <li>Arroz</li>
        <li>Pollo</li>
        <li>Verduras</li>
        <li>Aceite de oliva</li>
        <li>Azafrán</li>
    </ul>

    <h2>Elaboracion</h2>
    <ol class="elaboracion">
        <li>Calentar el aceite en la paella</li>
        <li>Añadir el pollo y dorarlo</li>
        <li>Agregar las verduras y sofreír</li>
        <li>Incorporar el arroz y mezclar bien</li>
        <li>Verter el agua y arroz y dejar que se cocine</li>
    </ol>
</body>
</html>
