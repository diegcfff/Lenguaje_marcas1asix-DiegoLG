<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Horario Semanal con estilos</title>
    <style>
        table {
            border: 1px solid black;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid black;
            text-align: center;
        }

        th {
            background-color:aqua
        }

        td {
            background-color:lightcyan
        }
    </style>
</head>
<body>
    <table>
        <caption>Horario semanal</caption>

        <thead> 
            <tr>
                <th>Hora</th>
                <th>Lunes</th>
                <th>Martes</th>
                <th>Miércoles</th>
                <th>Jueves</th>
                <th>Viernes</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <th>8:00 - 9:00</th>
                <td>Matemáticas</td>
                <td>Historia</td>
                <td>Matemáticas</td>
                <td>Inglés</td>
                <td>Lengua</td>
            </tr>

            <tr>
                <th>9:00 - 10:00</th>
                <td>Inglés</td>
                <td>Programación</td>
                <td>Física</td>
                <td>Programación</td>
                <td>Educación Física</td>
            </tr>

            <tr>
                <th>10:00 - 11:00</th>
                <td>Base de Datos</td>
                <td>Base de Datos</td>
                <td>Sistemas</td>
                <td>Sistemas</td>
                <td>Historia</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
